services:
  netbox:
    ports:
      - "8080:8080"
    environment:
      SECRET_KEY: ${NETBOX_SECRET_KEY}
      DB_PASSWORD: ${NETBOX_DB_PASSWORD}
      REDIS_PASSWORD: ${NETBOX_REDIS_PASSWORD}
      REDIS_CACHE_PASSWORD: ${NETBOX_REDIS_CACHE_PASSWORD}
      ALLOWED_HOSTS: ${NETBOX_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${NETBOX_CSRF_TRUSTED_ORIGINS}
      LOGIN_REQUIRED: ${NETBOX_LOGIN_REQUIRED}
    healthcheck:
      start_period: 120s

  netbox-worker:
    environment:
      SECRET_KEY: ${NETBOX_SECRET_KEY}
      DB_PASSWORD: ${NETBOX_DB_PASSWORD}
      REDIS_PASSWORD: ${NETBOX_REDIS_PASSWORD}
      REDIS_CACHE_PASSWORD: ${NETBOX_REDIS_CACHE_PASSWORD}

  postgres:
    environment:
      POSTGRES_PASSWORD: ${NETBOX_DB_PASSWORD}

  redis:
    environment:
      REDIS_PASSWORD: ${NETBOX_REDIS_PASSWORD}

  redis-cache:
    environment:
      REDIS_PASSWORD: ${NETBOX_REDIS_CACHE_PASSWORD}
